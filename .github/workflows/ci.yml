name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    # Dummy values so prisma.config.ts and NextAuth can load — this build
    # never talks to a real database. Migrations run separately, against the
    # real Neon database, as part of Vercel's own build step
    # (`prisma migrate deploy` in package.json's `build` script) — that's
    # the deployment pipeline, this is just the quality gate.
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      NEXTAUTH_SECRET: "ci-test-secret"
      NEXTAUTH_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # tsc needs Next's generated route types (PageProps, RouteContext,
      # LayoutProps, etc.), which only exist after next dev/build/typegen
      # has run once.
      - name: Generate Next.js types
        run: npx next typegen

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npx next build
